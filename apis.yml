aid: free-now
name: FREE NOW
description: >-
  FREE NOW is one of Europe's leading multi-mobility "super apps," letting riders
  book taxis and private-hire vehicles and, in many cities, e-scooters, e-bikes,
  e-mopeds, carsharing and public-transport tickets from a single application.
  Founded in Hamburg in 2009 as mytaxi and rebranded FREE NOW in 2019, the company
  operates across nine European countries and 150+ cities. It ran as part of the
  YOUR NOW mobility joint venture between Mercedes-Benz and BMW and was acquired by
  Lyft. FREE NOW exposes a partner/business integration API (FREE NOW for Business)
  through a password-gated developer portal at developer.free-now.com, and maintains
  an active open-source presence — including the Wave design system — under the
  freenowtech GitHub organization.
